{% load static %} <!DOCTYPE html>
<html lang="pl">
<head>
    <title>Wypożyczalnia Aut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'car_list' %}">CarRental</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'car_list' %}">Oferta</a>
                {% if user.is_authenticated %}
                    <span class="nav-link text-warning">Witaj, {{ user.username }}!</span>
                    <a class="nav-link" href="{% url 'my_rentals' %}">Moje rezerwacje</a>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="nav-link btn btn-link" style="text-decoration: none;">Wyloguj</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Zaloguj</a>
                    <a class="nav-link" href="{% url 'signup' %}">Rejestracja</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center mt-5 py-3 text-muted">
        <small>&copy; 2026 Car Renting Service</small>
    </footer>

    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
